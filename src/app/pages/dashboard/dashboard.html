<div class="dashboard-layout">
  <!-- Sidebar -->
  <div class="sidenav" [ngClass]="collapsed ? 'sidenav-collapsed' : ''">
    <div class="logo-container">
      <button class="logo" (click)="toggleCollapse()">SL</button>
      <div class="logo-text" *ngIf="collapsed">Dashboard Admin</div>
      <button class="btn-close" *ngIf="collapsed" (click)="closeSidenav()" title="Close sidenav"
        aria-label="Close sidenav">
        <i class="fal da-times close-icon"></i>
      </button>
    </div>

    <ul class="sidenav-nav">
      <li class="sidenav-nav-item" *ngFor="let data of navData">
        <a class="sidenav-nav-link" [routerLink]="[data.routeLink]" routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }">
          <i class="sidenav-link-icon" [class]="data.icon"></i>
          <span class="sidenav-link-text" *ngIf="collapsed">{{
            data.label
            }}</span>
        </a>
      </li>
    </ul>
  </div>

  <!-- Contenido -->
  <div class="dashboard-content">
    <router-outlet></router-outlet>
  </div>
</div>

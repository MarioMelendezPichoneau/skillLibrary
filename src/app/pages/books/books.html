<div class="container mt-4">
  <h2>Gestionar libros</h2>

  <form [formGroup]="bookForm" (ngSubmit)="submitForm()" class="mb-4">
    <div class="row g-2">
      <div class="col-md-4">
        <input type="text" formControlName="title" class="form-control" placeholder="Título" required>
      </div>
      <div class="col-md-4">
        <input type="text" formControlName="author" class="form-control" placeholder="Autor" required>
      </div>
      <div class="col-md-4">
        <input type="text" formControlName="genre" class="form-control" placeholder="Género" required>
      </div>
    </div>

    <div class="row g-2 mt-2">
      <div class="col-md-4">
        <label for="status" class="form-label">Estado</label>
        <select id="status" formControlName="status" class="form-select">
          <option value="" disabled>Selecciona el estado</option>
          <option value="Pendiente">Pendiente</option>
          <option value="Leido">Leído</option>
          <option value="En curso">En curso</option>
          <option value="Por leer">Por leer</option>

        </select>
      </div>
      <div class="col-md-8">
        <input type="text" formControlName="coverUrl" class="form-control" placeholder="URL de portada (opcional)" />
      </div>
    </div>

    <textarea formControlName="description" class="form-control mt-2" placeholder="Descripción (opcional)"></textarea>
    <textarea formControlName="notes" class="form-control mt-2" placeholder="Notas (opcional)"></textarea>

    <button type="submit" class="btn btn-primary mt-3">
      {{ editbookId ? 'Actualizar Libro' : 'Agregar Libro' }}
    </button>
    @if (editbookId) {
      <button type="button" class="btn btn-secondary mt-3 ms-2"
        (click)="editbookId = null; bookForm.reset({ status: 'Pendiente' })">
        Cancelar
      </button>
    }

  </form>

  <table class="table table-striped table-hover">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Título</th>
        <th>Autor</th>
        <th>Género</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      @for (book of Books; track $index) {

        <tr>
          <td>{{ book.id }}</td>
          <td>{{ book.title }}</td>
          <td>{{ book.author }}</td>
          <td>{{ book.genre }}</td>
          <td>
            <span class="badge bg-info">{{ book.status }}</span>
          </td>
          <td>
            <button class="btn btn-sm btn-primary me-2" [routerLink]="['/books', book.id]">Ver detalle</button>
            <button class="btn btn-sm btn-warning me-2" (click)="editBook(book)">Editar</button>
            <button class="btn btn-sm btn-danger" (click)="deleteBook(book.id)">Eliminar</button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>

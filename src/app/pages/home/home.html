
<div class="row p-3">
  @for (item of libros; track $index; let i = $index) {

    <div class="col col-md-6 col-lg-3 col-xl-3 mb-3">
      <div class="card h-100" >
        <img [src]="item.coverUrl" class="card-img-top" alt="{{item.title}}">
        <div class="card-body">
          <h5 class="card-title">{{item.title}}</h5>
          <h6 class="card-subtitle mb-2 text-muted">{{item.author}}</h6>
          <p class="card-text">{{item.description}}</p>
          <p><strong>{{item.status}}</strong></p>

          <a [routerLink]="['/books', item.id]" class="btn btn-primary">Ver Detalles</a>
        </div>
      </div>

    </div>
  }
</div>

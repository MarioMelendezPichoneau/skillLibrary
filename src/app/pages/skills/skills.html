<div class="container mt-4">
    <h2 class="mb-4">Lista de Habilidades</h2>
    <button class="btn btn-success mb-3" data-bs-toggle="modal" data-bs-target="#addModal">
        Añadir Habilidad
    </button>
    <table class="table table-striped table-hover">
        <thead class="table-dark">
           <tr>
            <th>Nombre</th>
            <th>Categoría</th>
            <th>Meta</th>
            <th>Progreso (%)</th>
            <th>Estado</th>
            <th>Descripción</th>
            <th>Libros</th>
            <th>Acciones</th>
           </tr> 
        </thead>  
        <tbody>
            <tr *ngFor="let skill of skills">
                <td>{{ skill.name }}</td>
                <td>{{ skill.category }}</td>
                <td>{{ skill.goal }}</td>
                <td>{{ skill.progress }}%</td>
                <td>
                    <div class="progress">
                    <div class="progress-bar" role="progressbar" [style.width.%]="skill.progress">
                    {{ skill.progress }}%
                    </div>
                    </div>
                </td>
                <td>{{ skill.status }}</td>
                <td>{{ skill.description }}</td>
                <td>
                    <ul class="list-unstyled mb-0">
                        <li *ngFor="let book of skill.books">{{ book }}</li>
                    </ul>
                </td>
                <td>
                  <!--   <button class="btn btn-primary btn-sm me-2" data-bs-toggle="modal" data-bs-target="#editModal" (click)="openEditModal(skill)">Editar</button>-->
                   <!-- <button class="btn btn-danger btn-sm" (click)="deleteSkill(skill.id)">Eliminar</button>
-->
                </td>
            </tr>
      </table>
</div>

<!-- Modal para crear/añadir habilidades -->
<div class="modal fade" id="addModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Nueva Habilidad</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form>
          <input type="text" class="form-control mb-2" placeholder="Nombre" [(ngModel)]="newSkill.name" name="name">
          <input type="text" class="form-control mb-2" placeholder="Categoría" [(ngModel)]="newSkill.category" name="category">
          <input type="text" class="form-control mb-2" placeholder="Meta" [(ngModel)]="newSkill.goal" name="goal">
          <textarea class="form-control mb-2" placeholder="Descripción" [(ngModel)]="newSkill.description" name="description"></textarea>
          <select class="form-select mb-2" [(ngModel)]="newSkill.status" name="status">
            <option>Pendiente</option>
            <option>Finalizada</option>
            <option>En progreso</option>
            <option>Por empezar</option>
          </select>
          <input type="number" class="form-control mb-2" placeholder="Progreso (%)" [(ngModel)]="newSkill.progress" name="progress" min="0" max="100">
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" id="closeAddModal" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <!--        <button type="button" class="btn btn-success" (click)="addSkill()">Guardar</button>
-->
      </div>
    </div>
  </div>
</div>

<!-- Modal para editar las habilidades -->
<div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content" *ngIf="editSkillData">
      <div class="modal-header">
        <h5 class="modal-title">Editar Habilidad</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form>
          <input type="text" class="form-control mb-2" [(ngModel)]="editSkillData.name" name="editName">
          <input type="text" class="form-control mb-2" [(ngModel)]="editSkillData.category" name="editCategory">
          <input type="text" class="form-control mb-2" [(ngModel)]="editSkillData.goal" name="editGoal">
          <textarea class="form-control mb-2" [(ngModel)]="editSkillData.description" name="editDescription"></textarea>
          <select class="form-select mb-2" [(ngModel)]="editSkillData.status" name="editStatus">
            <option>Pendiente</option>
            <option>Finalizada</option>
            <option>En progreso</option>
            <option>Por empezar</option>
          </select>
          <input type="number" class="form-control mb-2" [(ngModel)]="editSkillData.progress" name="editProgress" min="0" max="100">
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" id="closeEditModal" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <!--<button type="button" class="btn btn-primary" (click)="updateSkill()">Guardar Cambios</button>-->
      </div>
    </div>
  </div>
</div>
